[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: route all navigation requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enforce JavaScript MIME types for static assets
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
